name: Refresh blocklists

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-blocklists
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - run: node scripts/build-blocklist.mjs

      - name: Commit when the list changed
        run: |
          if git diff --quiet -- src/blocklist.txt; then
            echo "no change"
            exit 0
          fi
          domains=$(node -e "process.stdout.write(String(require('./src/blocklist-meta.json').domains))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blocklist.txt src/blocklist-meta.json
          git commit -m "Refresh blocklists to $domains domains"
          git push

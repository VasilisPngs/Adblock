name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in release.keystore.enc \
            -out release.keystore \
            -k "$ANDROID_KEYSTORE_PASSWORD"
          test -s release.keystore

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lint and test
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest --no-daemon

      - name: Check accessibility on a device
        timeout-minutes: 20
        run: >-
          ./gradlew :app:pixel10Api37DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-daemon

      - name: Generate Baseline Profile and build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: >-
          ./gradlew :app:generateReleaseBaselineProfile :app:assembleRelease
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-daemon

      - name: Show device test results
        if: failure()
        run: find . -path '*/build/outputs/androidTest-results/*' -name '*.xml' -exec cat {} +

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: Adblock
        run: |
          cp app/build/outputs/apk/release/app-release.apk Adblock.apk
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" Adblock.apk --repo "$REPO" --clobber
            gh api --method PATCH "repos/$REPO/git/refs/tags/$TAG_NAME" \
              -f sha="$GITHUB_SHA" -F force=true --silent
            gh release edit "$TAG_NAME" --repo "$REPO" --notes " " >/dev/null
            gh release edit "$TAG_NAME" --repo "$REPO" --draft >/dev/null
            for attempt in 1 2 3; do
              gh release edit "$TAG_NAME" --repo "$REPO" --draft=false >/dev/null && break || sleep 5
            done
            test "$(gh release view "$TAG_NAME" --repo "$REPO" --json isDraft --jq .isDraft)" = false
          else
            gh release create "$TAG_NAME" Adblock.apk \
              --repo "$REPO" \
              --title "Adblock" \
              --notes " "
          fi

      - name: Benchmark startup
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew :baselineprofile:pixel10Api37BenchmarkReleaseAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR \
            --no-daemon
          {
            echo '| Startup | Median time to initial display |'
            echo '| --- | --- |'
            find baselineprofile/build/outputs -name '*benchmarkData.json' -exec \
              jq -r '.benchmarks[] | "| \(.name) | \(.metrics.timeToInitialDisplayMs.median) ms |"' {} +
          } >> "$GITHUB_STEP_SUMMARY"
